<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em Html 5</title>
</head>
<body>
    <h1>Imagens Dinamicas</h1>
    <p>Tente abrir esse site em varios dispositivos ou simplesmente aumentar e diminuir o tamanho do seu navegador</p>
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="imagem flexivel">
    </picture>
    <h1>Reproduzindo audio em html 5</h1>
    <p>Vamos aprender a reproduzir audio em html 5</p>
    <audio src="midias/happymistake.mp3" controls></audio>
    <audio src="midias/James.m4a" controls></audio>
    <audio preload="metadata" controls>
      <source src="midias/guanacast33.mp3" type="audio/mpeg">
      <source src="midias/guanacast33.ogg" type="audio/ogg">
      <source src="midias/guanacast33.way" type="audio/way">
      <p>Infelizmento seu navegador nao consegue reproduzir o audio</p>
      <a href="midias/guanacast33.mp3">Clique aqui pra baixar o arquivo mp3</a>
    </audio><hr>
    <a href="../ex0012/index.html">Clique no link pra entrar no exercicio 12</a>
</body>
</html>
